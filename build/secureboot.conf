# shellcheck shell=bash disable=SC2034 # values are read by scripts/release/sign-secureboot*.sh
# Secure Boot inputs (ADR-0011). The shim is the one binary Sanctum takes
# from outside Arch Linux: Arch has no Microsoft-signed shim, so Sanctum
# reuses Fedora's. Every value is pinned; change them only in a reviewed
# commit, after checking the new shim's signatures and SBAT data
# (docs/development/secure-boot-research.md). This file is sourced by Bash.

# Fedora's shim-x64 package. 16.1-7 is in Fedora 44 to 46 (stable updates).
# Its shimx64.efi is signed by both Microsoft UEFI CAs (2011 and 2023).
SHIM_RPM_URL="https://kojipkgs.fedoraproject.org/packages/shim/16.1/7/x86_64/shim-x64-16.1-7.x86_64.rpm"
SHIM_RPM_SHA256="0a119f3488e5da27ca55c1864ee8e131afa5ecf27689385ba09b805eb00dd608"

# The two files Sanctum uses from the package, and their hashes. fbx64.efi
# (fallback) is deliberately left out: it writes boot entries to the
# machine's firmware.
SHIM_EFI_PATH="usr/lib/efi/shim/16.1-7/EFI/fedora/shimx64.efi"
SHIM_EFI_SHA256="351e131d3c4a636704e9cae7d1296baf8a05beca9922cfebbfa48933c9bf1ad3"
MOKMANAGER_EFI_PATH="usr/lib/efi/shim/16.1-7/EFI/fedora/mmx64.efi"
MOKMANAGER_EFI_SHA256="ed4442fa88cccba3a9e6a32d21a8f4c56bf5aab184f1fb9aadde8d3a9d04dc27"

# The subject of Sanctum's signing certificate. `sanctum secureboot` finds
# the enrolled key by it when the certificate file is not at hand.
SIGNING_CERT_CN="Abyssal Sanctum Secure Boot Signing"
