# shellcheck shell=bash disable=SC2034 # values are read by scripts/build/lib.sh
# Abyssal Sanctum build inputs. Every value here is pinned, so the same commit
# builds from the same packages and tools. Change them only in a reviewed
# commit (see docs/operations/updating-the-base.md once written, and
# ADR-0002). This file is sourced by Bash.

# Arch Linux Archive snapshot (YYYY/MM/DD) that all packages come from: the
# builder container's packages, archiso itself, and every package in the ISO.
SNAPSHOT_DATE="2026/10/01"

# Builder image, pinned by digest. Tag at the time of pinning:
# archlinux:base-devel (created 2026-09-28).
BUILDER_IMAGE="docker.io/library/archlinux@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3"

# archiso package version expected from the snapshot. build/profile/ was
# copied from this version's releng profile; when bumping it, diff the new
# releng against build/profile/ and port the relevant changes.
ARCHISO_VERSION="91-1"

# Size budget for the finished ISO, in MiB (GA section 2.6). The ISO is
# hosted outside GitHub (ADR-0005), so GitHub's 2 GiB asset limit does not
# apply. 3 GiB is a deliberate budget, not a technical limit: it keeps
# downloads, copytoram RAM use and build times reasonable. Raise it in a
# reviewed commit if a real need appears.
ISO_SIZE_WARN_MIB=2560
ISO_SIZE_FAIL_MIB=3072
