# Abyssal Sanctum LVM configuration (ADR-0006). Settings not listed here keep
# LVM's built-in defaults; see lvm.conf(5) and
# `lvmconfig --type default --withcomments`.

activation {
	# Never activate logical volumes automatically when a disk appears.
	# Activate them deliberately with: vgchange -ay [VG]
	auto_activation_volume_list = []
}
