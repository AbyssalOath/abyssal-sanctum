# Abyssal Sanctum initramfs. Derived from releng, with two changes:
# - no `kms` hook: it copied about 150 MB of GPU firmware into the initramfs,
#   which the ISO stores twice (ISO 9660 and the UEFI boot image). GPU drivers
#   now load from the root filesystem shortly after boot instead.
# - no `archiso_pxe_*` hooks: network boot is not supported (ROADMAP Phase 9).
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
