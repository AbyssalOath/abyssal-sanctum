# Abyssal Sanctum: sshd is installed but not started at boot, and the
# firewall blocks port 22 (ADR-0006). To allow remote logins, the user sets a
# root password and opens the port explicitly:
#
#   passwd
#   systemctl start sshd
#   nft add element inet sanctum tcp_open '{ 22 }'
#
# Root has no password by default, and sshd refuses empty passwords, so
# starting sshd alone does not allow anyone in.
PasswordAuthentication yes
PermitRootLogin yes
PermitEmptyPasswords no
