# Abyssal Sanctum NetworkManager defaults (ADR-0006).

[connectivity]
# No automatic "are we online" requests to a third-party server. Check
# connectivity by hand when needed: nmcli networking connectivity check
enabled=false

[connection]
# Temporary IPv6 addresses, so the machine's hardware address is not
# embedded in its global IPv6 address.
ipv6.ip6-privacy=2
