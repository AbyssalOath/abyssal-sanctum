#!/usr/bin/nft -f
# Abyssal Sanctum firewall (ADR-0006). Nothing on this machine is reachable
# from the network unless the user opens it. Outgoing traffic is allowed.
#
# Open a TCP port, for example for SSH:
#   nft add element inet sanctum tcp_open '{ 22 }'
# Close it again:
#   nft delete element inet sanctum tcp_open '{ 22 }'

destroy table inet sanctum
table inet sanctum {
	set tcp_open {
		type inet_service
		comment "TCP ports the user has opened"
	}

	chain input {
		type filter hook input priority filter
		policy drop

		ct state invalid drop comment "drop invalid packets"
		ct state { established, related } accept comment "replies to our own connections"
		iif lo accept comment "loopback"
		meta l4proto { icmp, ipv6-icmp } accept comment "ICMP (path MTU discovery, IPv6 neighbour discovery, ping)"
		ip6 saddr fe80::/10 udp dport 546 accept comment "DHCPv6 replies"
		tcp dport @tcp_open accept comment "ports opened by the user"
		pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
		counter
	}

	chain forward {
		type filter hook forward priority filter
		policy drop
	}
}
