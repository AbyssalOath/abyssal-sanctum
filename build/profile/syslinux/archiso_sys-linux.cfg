LABEL sanctum
TEXT HELP
Boot Abyssal Sanctum, the Arch Linux-based
System Recovery Environment.
ENDTEXT
MENU LABEL Abyssal Sanctum (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL sanctum-nomodeset
TEXT HELP
Use this if the screen stays blank or garbled.
The display runs at a basic resolution without GPU drivers.
ENDTEXT
MENU LABEL Abyssal Sanctum (%ARCH%, BIOS), safe graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%

LABEL sanctum-copytoram
TEXT HELP
Load the whole system into RAM, so the boot USB
can be removed. Needs about 4 GiB of RAM.
ENDTEXT
MENU LABEL Abyssal Sanctum (%ARCH%, BIOS), copy to RAM
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y %KERNEL_PARAMS%

LABEL sanctum-serial
TEXT HELP
Also send the console to the first serial port
(ttyS0, 115200 baud), for headless machines.
ENDTEXT
MENU LABEL Abyssal Sanctum (%ARCH%, BIOS), serial console
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200 %KERNEL_PARAMS%

LABEL sanctum-speech
TEXT HELP
Start the speakup screen reader.
ENDTEXT
MENU LABEL Abyssal Sanctum (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
