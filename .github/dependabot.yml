# Keeps the commit-SHA pins of GitHub Actions and the Cargo lockfile current.
# Every update arrives as a reviewable pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
