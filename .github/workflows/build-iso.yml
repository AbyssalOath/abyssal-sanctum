# Build the ISO in the pinned builder container, then boot-test it in QEMU
# with UEFI and BIOS (docs/architecture/ci-cd.md). The ISO is kept as a
# workflow artifact for 7 days. release.yml calls this workflow for tagged
# releases, with release: true (no caches, artifacts kept 30 days).
name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "scripts/build/**"
      - "scripts/test/**"
      - "tests/fixtures/**"
      - "crates/**"
      - "catalog/**"
      - "docs/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "VERSION"
      - ".github/workflows/build-iso.yml"
  pull_request:
    # Keep in sync with the push paths above.
    paths:
      - "build/**"
      - "scripts/build/**"
      - "scripts/test/**"
      - "tests/fixtures/**"
      - "crates/**"
      - "catalog/**"
      - "docs/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "VERSION"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Release build (ADR-0009)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner has about 14 GB free; the archiso work directory needs
      # 6-10 GB. Remove large preinstalled toolchains Sanctum does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Read build settings
        id: settings
        run: |
          source build/build.conf
          echo "snapshot=${SNAPSHOT_DATE//\//-}" >>"$GITHUB_OUTPUT"

      # The Arch Linux Archive is rate-limited; reuse downloaded packages.
      # Packages from one snapshot never change, so the key only needs the
      # snapshot date and the package lists. Release builds use no caches,
      # so nothing restored from another run can reach a release (ADR-0009).
      - name: Package cache
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cache/pacman
          key: pacman-${{ steps.settings.outputs.snapshot }}-${{ hashFiles('build/packages/*.list') }}
          restore-keys: pacman-${{ steps.settings.outputs.snapshot }}-

      # The Rust toolchain and crates for the sanctum CLI (ADR-0008).
      - name: Rust cache
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/cache/rustup
            out/cache/cargo
          key: rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Build ISO
        run: ./scripts/build/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso
          path: |
            out/abyssal-sanctum-v*-x86_64.iso
            out/abyssal-sanctum-v*-x86_64.iso.sha256
            out/abyssal-sanctum-v*-x86_64.build.log
            out/abyssal-sanctum-v*-x86_64.sources.txt
            out/abyssal-sanctum-v*-x86_64.manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.release && 30 || 7 }}
          compression-level: 0

  boot-test:
    name: Boot test (${{ matrix.firmware }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: out

      - name: Verify checksum
        working-directory: out
        run: sha256sum -c abyssal-sanctum-v*-x86_64.iso.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf

      - name: Boot test
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: scripts/test/boot-test.sh "--${FIRMWARE}" --log "out/boot-test-${FIRMWARE}.log"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-test-${{ matrix.firmware }}
          path: out/boot-test-${{ matrix.firmware }}.log
          if-no-files-found: ignore
          retention-days: 7
