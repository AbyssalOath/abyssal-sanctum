# Release a tagged version (ADR-0009, docs/operations/releasing.md).
#
# A tag vX.Y.Z on a commit already merged to main:
#   1. verify: the tag matches VERSION, Cargo and the changelog, and is on main
#   2. build: the ISO, from the tag, without caches, plus UEFI and BIOS boot tests
#   3. publish: a build provenance attestation for the ISO, then a draft
#      GitHub release with the checksum, source manifest and package manifest
#
# The ISO itself is not attached by the workflow (ADR-0005). The maintainer
# downloads it from this run's artifacts, verifies it, signs a Secure Boot
# copy offline (ADR-0011), attaches both (or uploads to SourceForge if over
# 2 GiB), uploads the package sources to SourceForge, and publishes the draft.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag, versions, changelog and main
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release/check-release.sh "${TAG}" --on-main

  build:
    name: Build and boot-test
    needs: verify
    permissions:
      contents: read
    # GitHub's newer self-repository form ($/...) is preferred, but actionlint
    # 1.7.12 rejects it. A job-level reusable workflow is read from the tagged
    # commit, not from files changed during the run. Switch when actionlint
    # supports $/.
    uses: ./.github/workflows/build-iso.yml # zizmor: ignore[self-repository]
    with:
      release: true

  publish:
    name: Attest and draft the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Repository settings can require a reviewer's approval for this
    # environment before anything is published.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso
          path: out

      - name: Verify checksum
        working-directory: out
        run: sha256sum -c abyssal-sanctum-v*-x86_64.iso.sha256

      # Sigstore-backed provenance through GitHub's OIDC token: no stored
      # secret. Anyone can check it with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/abyssal-sanctum-v*-x86_64.iso
            out/abyssal-sanctum-v*-x86_64.sources.txt
            out/abyssal-sanctum-v*-x86_64.manifest.json

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          scripts/release/release-notes.sh "${version}" >release-notes.md
          gh release create "${TAG}" \
            --draft \
            --verify-tag \
            --title "Abyssal Sanctum ${TAG}" \
            --notes-file release-notes.md \
            "out/abyssal-sanctum-${TAG}-x86_64.iso.sha256" \
            "out/abyssal-sanctum-${TAG}-x86_64.sources.txt" \
            "out/abyssal-sanctum-${TAG}-x86_64.manifest.json"
